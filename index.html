<!doctype html>
<html lang="en-ZA" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit</title>
<meta name="theme-color" content="#0D1524">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F9; --bg2:#E9EDF4; --panel:#FFFFFF; --panel2:#F6F8FB; --line:#DCE2EC;
  --text:#1C2740; --muted:#5F6B85; --faint:#8C97AE;
  --orange:#D9542A; --gold:#B8862E; --blue:#304C7A; --red:#C72138; --sage:#2F8C73;
  --accent:var(--orange); --pos:var(--sage); --neg:var(--red);
  --star:rgba(48,76,122,.0);
  --shadow:0 1px 0 rgba(28,39,64,.04), 0 8px 24px -12px rgba(28,39,64,.18);
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --tabh:64px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1524; --bg2:#121C30; --panel:#17233B; --panel2:#1D2B47; --line:#2A3B5E;
    --text:#F4F5F7; --muted:#A3B0CA; --faint:#6F7E9C;
    --orange:#E06236; --gold:#D7A64B; --blue:#6F90C6; --red:#E0475C; --sage:#7FC4A9;
    --star:rgba(244,245,247,.55);
    --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1524; --bg2:#121C30; --panel:#17233B; --panel2:#1D2B47; --line:#2A3B5E;
  --text:#F4F5F7; --muted:#A3B0CA; --faint:#6F7E9C;
  --orange:#E06236; --gold:#D7A64B; --blue:#6F90C6; --red:#E0475C; --sage:#7FC4A9;
  --star:rgba(244,245,247,.55);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
  -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:1;
  background-image:
    radial-gradient(1px 1px at 12% 18%,var(--star) 50%,transparent 51%),
    radial-gradient(1px 1px at 78% 9%,var(--star) 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 41% 33%,var(--star) 50%,transparent 51%),
    radial-gradient(1px 1px at 88% 46%,var(--star) 50%,transparent 51%),
    radial-gradient(1px 1px at 23% 62%,var(--star) 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 64% 71%,var(--star) 50%,transparent 51%),
    radial-gradient(1px 1px at 7% 88%,var(--star) 50%,transparent 51%),
    radial-gradient(1px 1px at 52% 94%,var(--star) 50%,transparent 51%),
    radial-gradient(1px 1px at 93% 81%,var(--star) 50%,transparent 51%),
    radial-gradient(1px 1px at 33% 5%,var(--star) 50%,transparent 51%);
  background-size:420px 520px;
}
.nostars .stars{display:none}
h1,h2,h3,.display{font-family:"Bricolage Grotesque","Manrope",ui-sans-serif,system-ui,sans-serif;letter-spacing:-.02em;margin:0}
h1{font-size:22px;font-weight:700}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:650}
p{margin:0 0 .6em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px} .tiny{font-size:12px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hidden{display:none!important}

/* ---------- shell ---------- */
.app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 16px calc(var(--tabh) + 28px)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);max-width:760px;margin:0 auto;padding:12px 16px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:30px;height:30px;flex:none}
.brand h1{font-size:21px}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--panel);box-shadow:var(--shadow)}
.iconbtn svg{width:20px;height:20px}
.subbar{display:flex;gap:8px;margin-top:10px;align-items:center}
.monthnav{display:flex;align-items:center;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);height:38px}
.monthnav button{width:34px;height:38px;display:grid;place-items:center;color:var(--muted)}
.monthnav span{min-width:104px;text-align:center;font-weight:650;font-size:14px}
.seg{display:flex;background:var(--panel);border-radius:12px;padding:3px;box-shadow:var(--shadow);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:6px 11px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--text)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--faint)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--text)}
.tabs button[aria-current="page"] svg{color:var(--orange)}
.tabs .plus{width:48px;height:48px;border-radius:16px;background:var(--orange);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px -8px var(--orange)}
.tabs .plus svg{width:26px;height:26px;color:#fff!important}

/* ---------- surfaces ---------- */
.card{background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px;margin-top:14px}
.card.flat{box-shadow:none;background:var(--panel2)}
.sect{margin-top:26px}
.sect > h2{margin-bottom:2px}
.sect > .muted{font-size:13px;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:13px;font-weight:700;font-size:15px;background:var(--panel2);color:var(--text)}
.btn.primary{background:var(--orange);color:#fff}
.btn.gold{background:var(--gold);color:#1C2740}
.btn.ghost{background:transparent;color:var(--muted);padding:0 10px}
.btn.danger{background:transparent;color:var(--red)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 8px;border-radius:999px;font-size:13px;font-weight:650;
  background:color-mix(in srgb,var(--c,#888) 18%,transparent);color:var(--text);white-space:nowrap;max-width:100%}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.chip.warn{outline:1.5px dashed color-mix(in srgb,var(--gold) 80%,transparent)}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--muted)}

label.field{display:block;margin-top:12px}
label.field > span{display:block;font-size:13px;font-weight:650;color:var(--muted);margin-bottom:5px}
.input,select.input,textarea.input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);padding:0 12px;font-size:16px}
textarea.input{height:auto;min-height:80px;padding:10px 12px}
.input:focus{outline:none;border-color:var(--orange)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.money-in{position:relative}
.money-in::before{content:"R";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);font-weight:700}
.money-in .input{padding-left:28px}

/* ---------- overview ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ringwrap{position:relative;width:176px;height:176px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringcenter .big{font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;font-size:27px;font-weight:750;letter-spacing:-.03em;line-height:1.05}
.ringcenter .lbl{font-size:12px;color:var(--muted);font-weight:600}
.stat{display:flex;flex-direction:column;gap:1px;margin-bottom:12px}
.stat:last-child{margin-bottom:0}
.stat b{font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;font-size:19px;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
@media (max-width:420px){ .hero{grid-template-columns:1fr;justify-items:center} .hero .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;text-align:center} .stat{margin:0} .ringwrap{width:190px;height:190px} }

.catrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.catrow:first-child{border-top:0}
.caticon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:color-mix(in srgb,var(--c) 22%,transparent)}
.catrow .name{font-weight:650;font-size:14.5px}
.bar{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--c,var(--orange))}
.bar.over i{background:var(--red)}
.amt{font-weight:750;font-size:14.5px;text-align:right;white-space:nowrap}
.amt small{display:block;font-weight:600;color:var(--muted);font-size:12px}

.insight{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.insight:first-child{border-top:0;padding-top:0}
.insight .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:15px;background:var(--panel2)}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--muted);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;background:var(--c)}

/* ---------- transactions ---------- */
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint)}
.search .input{padding-left:38px}
.dayhead{font-size:12.5px;font-weight:700;color:var(--muted);margin:18px 2px 6px}
.txlist{background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.tx{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.tx:first-child{border-top:0}
.tx .d{font-weight:600;font-size:14px}
.tx .s{font-size:12px;color:var(--muted)}

/* ---------- import ---------- */
.drop{border:2px dashed var(--line);border-radius:var(--r-lg);padding:26px 18px;text-align:center;background:var(--panel)}
.drop .big{font-size:40px;line-height:1}
.review-item{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.review-item:first-child{border-top:0}
.review-item.off{opacity:.45}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;margin-top:2px}
.check[aria-checked="true"]{background:var(--sage);border-color:var(--sage);color:#0D1524}
.check svg{width:15px;height:15px}
.review-item .top2{display:flex;justify-content:space-between;gap:10px}
.review-item .d{font-weight:600;font-size:14px;word-break:break-word}
.review-item .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px}
.stickybar{position:sticky;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 10px);z-index:10;margin-top:14px;
  background:var(--panel);border-radius:18px;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);padding:10px;display:flex;gap:8px;align-items:center}

/* ---------- goals ---------- */
.goal{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}
.goal .pr{width:64px;height:64px;position:relative}
.goal .pr svg{width:64px;height:64px;transform:rotate(-90deg)}
.goal .pr b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.tpl button{background:var(--panel);box-shadow:var(--shadow);border-radius:16px;padding:14px;text-align:left}
.tpl button b{display:block;font-size:14px;margin-top:6px}
.tpl button span{font-size:12px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--orange)}

/* ---------- tax ---------- */
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 0;font-size:14.5px}
.kv dd{padding-left:12px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700;text-align:right}
.kv .total{border-top:1px solid var(--line);padding-top:8px;color:var(--text);font-weight:750}
.bracket{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 6px;position:relative}
.bracket i{flex:1}
.bracket .you{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--text);border-radius:2px}
.claim{padding:14px 0;border-top:1px solid var(--line)}
.claim:first-child{border-top:0;padding-top:4px}
.claim h3{display:flex;gap:8px;align-items:center}
.callout{background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:14px;padding:12px 14px;font-size:13.5px;margin-top:12px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,10,20,.55);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;
  padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);
  max-width:760px;margin:0 auto;overscroll-behavior:contain}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin-bottom:4px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:12px}
.catgrid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:var(--panel);font-size:12.5px;font-weight:650;text-align:center;line-height:1.2}
.catgrid button[aria-pressed="true"]{outline:2px solid var(--c)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.switch input{appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--sage)}
.switch input:checked::after{transform:translateX(18px)}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%) translateY(20px);z-index:60;
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:650;font-size:14px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;padding:30px 10px}
.empty .big{font-size:42px}
.list-plain{list-style:none;margin:0;padding:0}
.list-plain li{padding:9px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.list-plain li:first-child{border-top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<div id="app">
  <header class="top" id="top"></header>
  <main class="app" id="view"></main>
  <div class="tabs" id="tabs"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ================= Orbit core ================= */
const APP_VERSION = '1.0';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const round2 = n => Math.round(n * 100) / 100;
const sum = a => a.reduce((s, x) => s + x, 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- money & dates ---------- */
function groupThousands(s) { return s.replace(/\B(?=(\d{3})+(?!\d))/g, '\u2009'); }
function fmtR(n, dec = false) {
  const neg = n < 0; const a = Math.abs(n);
  const s = dec ? a.toFixed(2) : Math.round(a).toString();
  const [i, d] = s.split('.');
  return (neg ? '−' : '') + 'R' + groupThousands(i) + (d ? '.' + d : '');
}
function fmtShort(n) {
  const a = Math.abs(n), neg = n < 0 ? '−' : '';
  if (a >= 1e6) return neg + 'R' + (a / 1e6).toFixed(a >= 1e7 ? 1 : 2).replace(/\.0+$/, '') + 'm';
  if (a >= 1e4) return neg + 'R' + Math.round(a / 1e3) + 'k';
  return fmtR(n);
}
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3 = MONTHS.map(m => m.slice(0, 3));
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const monthKey = s => s.slice(0, 7);
function monthLabel(mk, short = false) { const [y, m] = mk.split('-').map(Number); return (short ? MON3[m - 1] : MONTHS[m - 1]) + (short ? '' : ' ' + y); }
function addMonths(mk, n) { let [y, m] = mk.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return y + '-' + String(m).padStart(2, '0'); }
function dayLabel(s) { const d = new Date(s + 'T12:00'); return d.toLocaleDateString('en-ZA', { weekday: 'short', day: 'numeric', month: 'short' }); }
function shortDate(s) { const [y, m, d] = s.split('-'); return +d + ' ' + MON3[+m - 1]; }
/* SA tax year: 1 March to end Feb. "2027" means 1 Mar 2026 – 28 Feb 2027 */
function taxYearOf(dateStr) { const [y, m] = dateStr.split('-').map(Number); return m >= 3 ? y + 1 : y; }

/* ---------- palette ---------- */
const PALETTE = ['#E06236','#D7A64B','#6F90C6','#C72138','#7FC4A9','#B07AA1','#EE9A6B','#4FA3A5','#9AA9D9','#E8C66E','#D96C8B','#8DB36B','#5F7FB0','#C98B5A','#A68BD6'];

/* ---------- default categories ---------- */

function guessCategory(desc, amount, rules, cats) {
  const key = merchantKey(desc);

const Store = {
  db: null,
  async open() {
    if (!('indexedDB' in window)) return;
    try {
      this.db = await new Promise((res, rej) => { const r = indexedDB.open('orbit', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    } catch (e) { this.db = null; }
  },
  async get(k) {
    if (this.db) { try { return await new Promise((res, rej) => { const r = this.db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); } catch (e) {} }
    try { const v = localStorage.getItem('orbit:' + k); return v ? JSON.parse(v) : undefined; } catch (e) { return undefined; }
  },
  async set(k, v) {
    if (this.db) { try { await new Promise((res, rej) => { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); return true; } catch (e) {} }
    try { localStorage.setItem('orbit:' + k, JSON.stringify(v)); return true; } catch (e) { return false; }
  },
};

  { re: /\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](20\d{2}|\d{2})\b/, f: m => [m[3].length === 2 ? 2000 + +m[3] : +m[3], +m[2], +m[1]] },

/* ---------- PDF text extraction with pdf.js ---------- */
let pdfjsPromise = null;
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }

  if (window.pdfjsLib && window.pdfjsWorker) return window.pdfjsLib;

    const CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    try { await loadScript('lib/pdf.worker.min.js'); await loadScript('lib/pdf.min.js'); } catch (e) {}
    if (!window.pdfjsLib || !window.pdfjsWorker) { await loadScript(CDN + 'pdf.worker.min.js'); await loadScript(CDN + 'pdf.min.js'); }

    return window.pdfjsLib;

async function pdfToLines(buf, askPassword) {
  const lib = await loadPdfJs();
  const task = lib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false, disableFontFace: true });
  task.onPassword = async (update, reason) => {
    const pw = await askPassword(reason === 2);
    if (pw == null) { task.destroy(); return; }
    update(pw);
  };
  const doc = await task.promise;
  const lines = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    const items = tc.items.filter(i => i.str && i.str.trim()).map(i => ({ s: i.str, x: i.transform[4], y: i.transform[5], w: i.width || i.str.length * 4, h: Math.abs(i.transform[3]) || 8 }));
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    const rows = [];
    for (const it of items) {
      const tol = Math.max(2.5, it.h * 0.45);
      let r = rows.find(r => Math.abs(r.y - it.y) <= tol);
      if (!r) { r = { y: it.y, items: [] }; rows.push(r); }
      r.items.push(it);
    }
    rows.sort((a, b) => b.y - a.y);
    for (const r of rows) {
      r.items.sort((a, b) => a.x - b.x);
      let txt = '', lastEnd = null;
      for (const it of r.items) {
        if (lastEnd != null) { const gap = it.x - lastEnd; txt += gap > 6 ? '   ' : (gap > 1 ? ' ' : ''); }
        txt += it.s; lastEnd = it.x + it.w;
      }
      lines.push(txt.replace(/\s+$/, ''));
    }
    lines.push('');
  }
  await doc.destroy();
  return lines;
}

function statementEnd(lines) {
  // the latest full date (with year) in the first part of the statement tells us the year for "12 Aug" style dates

  for (const l of lines.slice(0, 80)) {
    let t = l, guard = 0;
    while (guard++ < 6) {
      const d = findDate(t); if (!d) break;
      if (d.y) { const s = d.y + '-' + String(d.m).padStart(2, '0') + '-' + String(d.d).padStart(2, '0'); if (!latest || s > latest) latest = s; }

    }
  }
  return latest;
}

async function parseStatementFile(file, opts, askPassword) {
  const name = file.name.toLowerCase();
  const buf = await file.arrayBuffer();
  const head = new TextDecoder('latin1').decode(buf.slice(0, 5));
  if (name.endsWith('.pdf') || head === '%PDF-') {
    const lines = await pdfToLines(buf, askPassword);
    const res = parseStatementLines(lines, opts);

const SLIP_FIELDS = [

  for (const id in totals) {
    const c = cat(id); const v = totals[id];
    if (c.type === 'expense') { spend += -v; if (-v > 0.5) byCat.push({ c, v: -v }); }
    else if (c.type === 'income') income += v;
    else if (c.type === 'savings') saved += -v;
  }
  byCat.sort((a, b) => b.v - a.v);
  return { list, spend, income, saved, byCat };
}
function recurring(txs = visibleTx()) {
  const g = {};
  for (const t of txs) { if (t.amount >= 0 || cat(t.cat).type === 'transfer') continue; const k = merchantKey(t.desc); (g[k] = g[k] || []).push(t); }
  const out = [];
  for (const k in g) {
    const byM = {};
    for (const t of g[k]) byM[monthKey(t.date)] = (byM[monthKey(t.date)] || 0) + -t.amount;
    const vals = Object.values(byM);
    if (vals.length < 3) continue;
    const sorted = [...vals].sort((a, b) => a - b); const med = sorted[Math.floor(sorted.length / 2)];
    if (sorted[sorted.length - 1] / Math.max(1, sorted[0]) > 1.35) continue;
    if (g[k].length > vals.length * 2) continue;
    out.push({ key: k, monthly: med, cat: g[k][g[k].length - 1].cat, months: vals.length, last: g[k][g[k].length - 1] });
  }
  return out.sort((a, b) => b.monthly - a.monthly);
}

/* ---------- charts ---------- */
function ringSVG(parts, total) {
  const r = 78, C = 2 * Math.PI * r, gap = parts.length > 1 ? 3 : 0;
  let off = 0, segs = '';
  if (!total) segs = `<circle cx="100" cy="100" r="${r}" fill="none" stroke="var(--panel2)" stroke-width="20"/>`;
  for (const p of parts) {
    const len = Math.max(0, (p.v / total) * C - gap);
    segs += `<circle cx="100" cy="100" r="${r}" fill="none" stroke="${p.color}" stroke-width="20" stroke-linecap="butt" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}"/>`;
    off += (p.v / total) * C;
  }
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Spending by category">${segs}</svg>`;
}
function stackedBars(months, series, opts = {}) {
  const W = 360, H = 190, pad = { l: 40, r: 6, t: 10, b: 24 };
  const totals = months.map((_, i) => sum(series.map(s => s.vals[i] || 0)));
  const max = Math.max(1, ...totals, opts.line || 0) * 1.08;
  const bw = (W - pad.l - pad.r) / months.length;
  const y = v => pad.t + (H - pad.t - pad.b) * (1 - v / max);
  let g = '';
  for (let k = 0; k <= 3; k++) { const v = max / 1.08 * k / 3; g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--faint)">${fmtShort(v)}</text>`; }
  months.forEach((m, i) => {
    let acc = 0; const x = pad.l + i * bw + bw * 0.18, w = bw * 0.64;
    series.forEach(s => { const v = s.vals[i] || 0; if (v <= 0) return; const y0 = y(acc), y1 = y(acc + v); g += `<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(0, y0 - y1 - 1.5)}" rx="3" fill="${s.color}"/>`; acc += v; });
    g += `<text x="${x + w / 2}" y="${H - 7}" text-anchor="middle" font-size="11" font-weight="${m === opts.hi ? 800 : 600}" fill="${m === opts.hi ? 'var(--text)' : 'var(--muted)'}">${monthLabel(m, true)}</text>`;
  });
  if (opts.line) g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(opts.line)}" y2="${y(opts.line)}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opts.label || 'Monthly chart')}">${g}</svg>`;
}

  <div class="card">

      <div class="stats">
        <div class="stat"><span>Money in</span><b class="pos">${fmtR(cur.income)}</b></div>

  ${rec.length ? `<div class="sect"><h2>Recurring payments</h2><p class="muted">Things that came off in at least three different months. Worth a yearly look.</p>
    <div class="card" style="padding:8px 16px"><ul class="list-plain">${rec.slice(0, 12).map(r => `<li><span class="row grow" style="gap:10px"><span class="caticon" style="--c:${cat(r.cat).color};width:28px;height:28px;font-size:14px">${cat(r.cat).icon}</span><span class="grow ellipsis">${esc(titleCase(r.key))}</span></span><b>${fmtR(r.monthly)}</b></li>`).join('')}
    <li><span class="muted">About ${fmtR(sum(rec.map(r => r.monthly)))} a month, ${fmtR(sum(rec.map(r => r.monthly)) * 12)} a year</span></li></ul></div></div>` : ''}`;
}

async function editTx(id) {
  const t = S.txns.find(x => x.id === id); if (!t) return;
  const key = merchantKey(t.desc);
  const draw = () => {
    const c = cat(t.cat);
    return `<h2 style="word-break:break-word">${esc(cleanDesc(t.desc))}</h2><p class="muted small">${dayLabel(t.date)}${acct(t.acc) ? ', ' + esc(acct(t.acc).name) : ''}</p>
    <div class="display ${t.amount > 0 ? 'pos' : ''}" style="font-size:30px;font-weight:750;margin:8px 0 4px">${t.amount > 0 ? '+' : '−'}${fmtR(Math.abs(t.amount), true).replace('−', '')}</div>
    <label class="field"><span>Category</span><button class="chip" style="--c:${c.color};height:40px;font-size:15px" data-x="cat"><span class="caticon" style="--c:${c.color};width:26px;height:26px;font-size:14px">${c.icon}</span>${esc(c.name)}</button></label>
    <label class="field"><span>Note</span><input class="input" id="note" value="${esc(t.note || '')}" placeholder="Add a note"></label>
    <p class="tiny faint" style="margin-top:10px">Full description: ${esc(t.desc)}</p>
    <div class="row" style="margin-top:16px"><button class="btn danger" data-x="del">Delete</button><span class="grow"></span><button class="btn primary" data-x="done">Done</button></div>`;
  };
  openSheet(draw(), (el, api) => {
    el.addEventListener('click', async e => {
      const b = e.target.closest('[data-x]'); if (!b) return;
      if (b.dataset.x === 'cat') {
        const others = S.txns.filter(x => x.id !== t.id && merchantKey(x.desc) === key && x.cat === t.cat);
        const r = await pickCategory(t.cat, { rememberKey: titleCase(key), rememberHint: others.length ? `Also moves ${others.length} other transaction${others.length > 1 ? 's' : ''} from here, and sorts future imports the same way.` : undefined });
        if (!r) return;
        t.cat = r.cat;
        if (r.remember) { S.rules[key] = r.cat; others.forEach(x => x.cat = r.cat); }
        save(); el.innerHTML = '<div class="grab"></div>' + draw(); render();
      } else if (b.dataset.x === 'del') {
        if (await confirmSheet('Delete this transaction?', 'It’s removed from your totals. Importing the same statement again would bring it back.', 'Delete', true)) { S.txns = S.txns.filter(x => x.id !== t.id); save(); api.close(); render(); toast('Deleted'); }
      } else if (b.dataset.x === 'done') { t.note = $('#note', el).value.trim(); save(); api.close(); render(); }
    });
    $('#note', el).addEventListener('change', e => { t.note = e.target.value.trim(); save(); });
  });
}

async function startImport(files, v) {

      const ask = async wrong => { if (lastPw && !triedCached) { triedCached = true; return lastPw; } const p = await askPasswordSheet(wrong, f.name); if (p) lastPw = p; else f._skipped = true; return p; };
      const res = await parseStatementFile(f, { creditCard: account.type === 'card' }, ask);
      if (!res.txns.length) { notes.push({ f: f.name, bad: true, msg: 'No transactions found. Try the CSV export for this one.' }); continue; }
      const range = shortDate(res.txns[0].date) + ' to ' + shortDate(res.txns[res.txns.length - 1].date) + ' ' + res.txns[res.txns.length - 1].date.slice(0, 4);
      let check = '';

      if (res.checks > 3) check = !off ? 'Balances add up on every line.' : `${off} line${off > 1 ? 's' : ''} didn’t match the running balance; they’re under “Needs a look”.`;
      notes.push({ f: f.name, msg: `${res.txns.length} transactions, ${range}. ${check}`, bad: res.checks > 3 && off / res.checks > 0.03 });
      res.txns.forEach(t => items.push(t));
    } catch (e) {
      console.error(e);
      notes.push({ f: f.name, bad: true, msg: f._skipped || /password/i.test(String(e && (e.name + e.message))) ? 'Skipped: it needs a password.' : 'Couldn’t read this file. If it’s a scanned image, use the CSV from online banking.' });

    seen[base] = (seen[base] || 0) + 1;
    const id = txIdFor(accId, t, seen[base]);

  });

const GOAL_TEMPLATES = [
  { name: 'TFSA in the S&P 500', emoji: '🌍', kind: 'tfsa', rate: 10, monthly: 3833, target: 0, note: 'R46 000 a year, R500 000 lifetime' },

function ownerAge(owner) { const p = S.people.find(x => x.id === owner) || S.people[0]; return +p.age || 30; }
function horizonMonths(owner) { return Math.max(12, (S.settings.retireAge - ownerAge(owner)) * 12); }
function project(g, extra = 0, months = horizonMonths(g.owner)) {
  let bal = +g.current || 0, pm = (+g.monthly || 0) + extra, r = (+g.rate || 0) / 100 / 12, step = (+g.step || 0) / 100;
  let life = g.kind === 'tfsa' ? (+g.lifetime || +g.current || 0) : 0, yearC = 0, contrib = 0;
  const pts = [bal], cps = [0]; let hit = null, lifeFull = null;
  for (let m = 1; m <= months; m++) {
    if (m > 1 && (m - 1) % 12 === 0) { pm *= 1 + step; yearC = 0; }
    let c = pm;
    if (g.kind === 'tfsa') { c = Math.max(0, Math.min(c, 46000 - yearC, 500000 - life)); yearC += c; life += c; if (!lifeFull && life >= 500000) lifeFull = m; }
    bal = bal * (1 + r) + c; contrib += c;
    pts.push(bal); cps.push(contrib);
    if (!hit && +g.target > 0 && bal >= +g.target) hit = m;
  }
  return { pts, cps, hit, lifeFull };
}
const inMonths = m => { const d = new Date(); d.setMonth(d.getMonth() + m); return MONTHS[d.getMonth()] + ' ' + d.getFullYear(); };
const durationLabel = m => m < 12 ? `${m} month${m === 1 ? '' : 's'}` : `${Math.floor(m / 12)} year${m >= 24 ? 's' : ''}${m % 12 ? `, ${m % 12} month${m % 12 > 1 ? 's' : ''}` : ''}`;
function real(v, m) { return v / Math.pow(1 + S.settings.inflation / 100, m / 12); }
function lineChart(series, opts = {}) {
  const W = 360, H = 180, pad = { l: 44, r: 8, t: 10, b: 22 };
  const n = series[0].pts.length;
  const max = Math.max(1, ...series.flatMap(s => s.pts), opts.target || 0) * 1.05;
  const x = i => pad.l + (W - pad.l - pad.r) * i / (n - 1), y = v => pad.t + (H - pad.t - pad.b) * (1 - v / max);
  let g = '';
  for (let k = 0; k <= 3; k++) { const v = max / 1.05 * k / 3; g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--faint)">${fmtShort(v)}</text>`; }
  const yrs = Math.round((n - 1) / 12); const every = yrs > 20 ? 10 : yrs > 8 ? 5 : yrs > 3 ? 2 : 1;
  for (let yy = 0; yy <= yrs; yy += every) { const i = Math.min(n - 1, yy * 12); g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--faint)">${opts.ageStart != null ? 'age ' + (opts.ageStart + yy) : new Date().getFullYear() + yy}</text>`; }
  if (opts.target) g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(opts.target)}" y2="${y(opts.target)}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  for (const s of series) {
    const step = Math.max(1, Math.floor(n / 120));
    let d = ''; for (let i = 0; i < n; i += step) d += (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(s.pts[i]).toFixed(1);
    d += 'L' + x(n - 1).toFixed(1) + ' ' + y(s.pts[n - 1]).toFixed(1);
    if (s.fill) g += `<path d="${d}L${x(n - 1)} ${y(0)}L${x(0)} ${y(0)}Z" fill="${s.color}" opacity=".16"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w || 2.5}" stroke-linejoin="round" ${s.dash ? 'stroke-dasharray="5 5"' : ''}/>`;
  }

}

function editGoal(g, isNew = false) {

      <label class="field"><span>Balance today</span><div class="money-in"><input class="input" inputmode="decimal" data-f="current" value="${+g.current || ''}"></div></label>
      <label class="field"><span>Target (optional)</span><div class="money-in"><input class="input" inputmode="decimal" data-f="target" value="${+g.target || ''}"></div></label>
      <label class="field"><span>Monthly contribution</span><div class="money-in"><input class="input" inputmode="decimal" data-f="monthly" value="${+g.monthly || ''}"></div></label>
      <label class="field"><span>Expected growth a year (%)</span><input class="input" inputmode="decimal" data-f="rate" value="${g.rate}"></label>
      <label class="field"><span>Raise contribution yearly (%)</span><input class="input" inputmode="decimal" data-f="step" value="${+g.step || 0}"></label>

    const rerender = () => { const st = el.scrollTop; el.innerHTML = '<div class="grab"></div>' + draw(); el.scrollTop = st; bind(); };
    const bind = () => {
      $$('[data-f]', el).forEach(inp => inp.addEventListener('change', () => {

    });

}

/* ================= Tax (South Africa) ================= */
/* Source: SARS rates of tax for individuals and the 2026 Budget tax guide. Key = year of assessment end. */
const TAX = {
  2027: { label: '2026/27 (1 Mar 2026 to 28 Feb 2027)', brackets: [[245100, .18], [383100, .26], [530200, .31], [695800, .36], [887000, .39], [1878600, .41], [Infinity, .45]], rebates: [17820, 9765, 3249], mtc: [376, 254], raCap: 430000, tfsa: 46000, interestEx: 23800 },
  2026: { label: '2025/26 (1 Mar 2025 to 28 Feb 2026)', brackets: [[237100, .18], [370500, .26], [512800, .31], [673000, .36], [857900, .39], [1817000, .41], [Infinity, .45]], rebates: [17235, 9444, 3145], mtc: [364, 246], raCap: 350000, tfsa: 36000, interestEx: 23800 },
};
function bracketTax(T, inc) { let tax = 0, lo = 0; for (const [hi, r] of T.brackets) { if (inc > lo) tax += (Math.min(inc, hi) - lo) * r; lo = hi; } return tax; }
function marginal(T, inc) { let lo = 0; for (const [hi, r] of T.brackets) { if (inc <= hi) return r; lo = hi; } return .45; }
function taxRange(year) { return [(year - 1) + '-03-01', year + '-02-29']; }
function autoFromStatements(year, person) {
  const [a, b] = taxRange(year);
  const own = t => { const o = acct(t.acc)?.owner || 'joint'; return o === person || o === 'joint'; };
  const tx = S.txns.filter(t => t.date >= a && t.date <= b && own(t));
  const months = new Set(tx.map(t => monthKey(t.date))).size || 0;
  const tot = f => -sum(tx.filter(f).map(t => t.amount));
  const annual = v => months ? v / months * 12 : 0;
  const charityRe = /GIFT OF THE GIVERS|SPCA|NSRI|CANSA|DONATION|CHARITY|FOUNDATION|HOSPICE|SOS CHILDREN|WWF|BACKABUDDY|GIVENGAIN|NPC|NPO|PBO|TRUST/i;
  return {
    months,
    ra: annual(tot(t => t.cat === 'ra')),
    medBank: annual(tot(t => t.cat === 'medaid')),
    oop: tot(t => t.cat === 'health'),
    donations: tot(t => t.cat === 'gifts' && charityRe.test(t.desc)),
    interest: annual(-tot(t => t.cat === 'interest')),
    fuel: tot(t => t.cat === 'fuel'),
  };
}
function taxInputs(year, person) {
  S.tax.slips[year] = S.tax.slips[year] || {}; S.tax.extras[year] = S.tax.extras[year] || {};
  const slip = S.tax.slips[year][person] = S.tax.slips[year][person] || {};
  const ex = S.tax.extras[year][person] = S.tax.extras[year][person] || { medMembers: 1 };
  return { slip, ex };
}
function calcTax(year, person, extraRAmonthly = 0) {
  const T = TAX[year]; const { slip, ex } = taxInputs(year, person); const auto = autoFromStatements(year, person);
  const pick = (k, a) => ex[k] != null && ex[k] !== '' ? +ex[k] : a;
  const age = +(S.people.find(p => p.id === person)?.age) || 30;
  const m = k => +slip[k] || 0;
  const bonus = +ex.bonus || 0;
  const remuneration = (m('gross') + m('pensionEr') + m('medicalEr')) * 12 + bonus;
  const ra = pick('ra', auto.ra) + extraRAmonthly * 12;
  const interest = pick('interest', auto.interest);
  const taxableInterest = Math.max(0, interest - T.interestEx);
  const contrib = (m('pension') + m('pensionEr')) * 12 + ra;
  const preRet = remuneration + taxableInterest;
  const retCap = Math.min(T.raCap, .275 * Math.max(remuneration, preRet));
  const retDed = Math.min(contrib, retCap);
  const afterRet = preRet - retDed;
  const donations = pick('donations', auto.donations);
  const donDed = Math.min(donations, .1 * afterRet);
  const taxable = Math.max(0, afterRet - donDed);
  const gross = bracketTax(T, taxable);
  const rebate = T.rebates[0] + (age >= 65 ? T.rebates[1] : 0) + (age >= 75 ? T.rebates[2] : 0);
  const members = Math.max(0, +ex.medMembers || 0);
  const medPaid = (m('medical') + m('medicalEr')) * 12 + pick('medBank', auto.medBank);
  const mtcMonthly = medPaid > 0 && members > 0 ? T.mtc[0] + (members >= 2 ? T.mtc[0] : 0) + Math.max(0, members - 2) * T.mtc[1] : 0;
  const mtc = mtcMonthly * 12;
  const oop = pick('oop', auto.oop);
  const excess = Math.max(0, medPaid - 4 * mtc);
  const amec = age >= 65 ? .333 * (excess + oop) : .25 * Math.max(0, excess + oop - .075 * taxable);
  const amecThreshold = Math.max(0, .075 * taxable - excess);
  const afterRebate = Math.max(0, gross - rebate);
  const due = Math.max(0, afterRebate - mtc - amec);
  const paye = m('paye') * 12 + (+ex.bonusPaye || 0);
  return { T, auto, remuneration, ra, contrib, retCap, retDed, room: Math.max(0, retCap - contrib), interest, taxableInterest, donations, donDed, taxable, gross, rebate, mtc, medPaid, oop, amec, amecThreshold, due, paye, diff: paye - due, marg: marginal(T, taxable), eff: remuneration ? due / remuneration : 0, slip, ex, members };
}
function renderTax(v) {
  const years = Object.keys(TAX).map(Number).sort((a, b) => b - a);
  const nowY = taxYearOf(ymd(new Date()));
  if (!S.tax.year || !TAX[S.tax.year]) S.tax.year = TAX[nowY] ? nowY : years[0];
  const Y = S.tax.year, P = UI.taxPerson;
  const r = calcTax(Y, P);
  const hasSlip = r.slip.gross > 0;
  const fld = (k, label, src = 'slip') => { const val = (src === 'slip' ? r.slip : r.ex)[k]; return `<label class="field"><span>${label}</span><div class="money-in"><input class="input" inputmode="decimal" data-tf="${src}:${k}" value="${val != null && val !== '' ? val : ''}"></div></label>`; };
  const autoFld = (k, label, autoVal, hint) => { const has = r.ex[k] != null && r.ex[k] !== ''; return `<label class="field"><span>${label}</span><div class="money-in"><input class="input" inputmode="decimal" data-tf="ex:${k}" value="${has ? r.ex[k] : ''}" placeholder="${Math.round(autoVal)}"></div>${!has && autoVal ? `<span class="tiny faint">Using ${fmtR(autoVal)} ${hint}</span>` : ''}</label>`; };
  const withRA = calcTax(Y, P, 1000);
  const raSaving = r.due - withRA.due;
  const claims = [];
  if (r.ra > 0) claims.push(['🌅', 'Retirement annuity', `Your RA contributions (${fmtR(r.ra)} for the year) are deductible on top of your pension. Make sure the IT3(f) certificate from your RA provider shows on eFiling; it’s worth about <b>${fmtR(r.ra * r.marg)}</b> at your ${Math.round(r.marg * 100)}% rate.`]);
  if (r.room > 1000) claims.push(['📥', 'Room to save more tax', `You can still put about <b>${fmtR(r.room)}</b> (${fmtR(r.room / 12)} a month) into retirement savings this year and deduct it. Every extra R1 000 a month in an RA cuts your tax by roughly <b>${fmtR(raSaving)}</b> a year. RA money is locked until 55, so weigh that against your TFSA.`]);
  else if (r.contrib > 0) claims.push(['✅', 'Retirement deduction maxed', `Your contributions already use the full deduction (${fmtR(r.retCap)}). Extra saving is best in your TFSA.`]);
  if (r.medPaid > 0) claims.push(['🩺', 'Medical credits', `${r.members} member${r.members === 1 ? '' : 's'} on medical aid gives a credit of ${fmtR(r.mtc)} this year.${r.amec > 0 ? ` Your out-of-pocket costs add about <b>${fmtR(r.amec)}</b> back.` : r.oop > 0 ? ` Out-of-pocket costs (${fmtR(r.oop)} so far from pharmacies and doctors) only count once they pass about ${fmtR(r.amecThreshold)} this year, so they won’t change your refund unless you have a big medical year. Keep the slips anyway.` : ''}`]);
  else claims.push(['🩺', 'Medical aid', 'If you pay medical aid outside your payslip, enter it under yearly extras. Each member earns a monthly tax credit.']);
  if (r.donations > 0) claims.push(['🎁', 'Donations', `Gifts to registered charities (${fmtR(r.donations)} found) are deductible if you get a section 18A certificate from each one. That’s worth about <b>${fmtR(r.donDed * r.marg)}</b>.`]);
  if (+r.slip.travel > 0) claims.push(['🚗', 'Travel allowance', `You get a travel allowance, so a logbook of business kilometres can reduce the tax on it. Driving between home and the office doesn’t count as business travel. Without a logbook, SARS taxes the whole allowance.`]);
  if (r.interest > 0) claims.push(['🪙', 'Interest', r.interest > r.T.interestEx ? `About ${fmtR(r.interest)} interest this year; ${fmtR(r.taxableInterest)} is above the ${fmtR(r.T.interestEx)} exemption and is taxed. Interest inside a TFSA isn’t.` : `About ${fmtR(r.interest)} interest this year, under the ${fmtR(r.T.interestEx)} exemption, so no tax on it.`]);
  const tfsaGoals = S.goals.filter(g => g.kind === 'tfsa' && (g.owner === P));
  if (tfsaGoals.length) { const put = sum(tfsaGoals.map(g => +g.thisYear || 0)); claims.push(['🌍', 'Tax-free savings', put > r.T.tfsa ? `<span class="neg">You’ve put in ${fmtR(put)}, over the ${fmtR(r.T.tfsa)} limit. SARS taxes the excess at 40%.</span>` : `${fmtR(put)} of your ${fmtR(r.T.tfsa)} allowance used; ${fmtR(r.T.tfsa - put)} left before 28 February.`]); }
  claims.push(['🏠', 'Home office', 'Only claimable if you do most of your work from a room at home used only for work. For most people based at an office, it isn’t.']);

  const brTot = Math.min(r.T.brackets.length, 6);
  const brCols = ['#7FC4A9', '#6F90C6', '#D7A64B', '#E06236', '#C72138', '#B07AA1'];
  const capTop = r.T.brackets[5][0];
  const pos = clamp(r.taxable / capTop * 100, 0, 100);

  v.innerHTML = `

  <div class="row wrap" style="margin-top:10px">

    ${r.slip._from ? `<p class="tiny muted" style="margin:6px 0 0">Read from ${esc(r.slip._from)}. Check each number against the payslip.</p>` : `<p class="tiny muted" style="margin:6px 0 0">Upload a PDF payslip or type the amounts in.</p>`}
    <div class="grid2">${fld('gross', 'Gross pay')}${fld('paye', 'PAYE')}${fld('pension', 'Pension or provident (you)')}${fld('pensionEr', 'Pension (employer pays)')}${fld('medical', 'Medical aid (you)')}${fld('medicalEr', 'Medical aid (employer)')}${fld('travel', 'Travel allowance')}${fld('uif', 'UIF')}</div>

      ${autoFld('oop', 'Medical costs not covered', r.auto.oop, 'from Health & pharmacy')}

    <p class="tiny muted" style="margin:0">${(() => { let lo = 0; for (const [hi, rate] of r.T.brackets) { if (r.taxable <= hi) return `Your top rand is taxed at ${Math.round(rate * 100)}%, the band from ${fmtR(lo + 1)} to ${hi === Infinity ? 'the top' : fmtR(hi)}.`; lo = hi; } return ''; })()}</p>
    <dl class="kv" style="margin-top:14px">
      <dt>Income for the year</dt><dd>${fmtR(r.remuneration)}</dd>
      <dt>Retirement deduction</dt><dd>−${fmtR(r.retDed).replace('−', '')}</dd>

  <p class="tiny faint" style="margin-top:14px">This is an estimate using SARS’s published tables for ${TAX[Y].label.split(' ')[0]}, not tax advice. Your final assessment uses the IRP5 from your employer. For anything unusual, check with a registered tax practitioner.</p>`;

/* ================= Settings & backups ================= */
function openSettings() {
  const p = S.people;
  openSheet(`<h2>Settings</h2>
    <h3 style="margin-top:14px">The two of you</h3>
    <div class="grid2">${p.map((x, i) => `<label class="field"><span>${i ? 'Second person' : 'First person'}</span><input class="input" data-pp="${i}:name" value="${esc(x.name)}"></label><label class="field"><span>Age</span><input class="input" inputmode="numeric" data-pp="${i}:age" value="${x.age || ''}"></label>`).join('')}</div>
    <p class="tiny faint" style="margin-top:6px">Use the same two names, in the same order, on both phones so shared backups line up.</p>
    <div class="grid2"><label class="field"><span>Retirement age</span><input class="input" inputmode="numeric" data-st="retireAge" value="${S.settings.retireAge}"></label><label class="field"><span>Inflation (%)</span><input class="input" inputmode="decimal" data-st="inflation" value="${S.settings.inflation}"></label></div>
    <h3 style="margin-top:18px">Look</h3>
    <div class="seg" style="margin-top:8px" id="theme">${[['dark', 'Starfield'], ['light', 'Starfield light'], ['auto', 'Match phone']].map(([k, l]) => `<button data-th="${k}" aria-pressed="${S.settings.theme === k}">${l}</button>`).join('')}</div>
    <label class="switch"><span>Stars in the background</span><input type="checkbox" id="stars" ${S.settings.stars ? 'checked' : ''}></label>
    <h3 style="margin-top:8px">Organise</h3>
    <div class="row wrap" style="margin-top:8px"><button class="btn" data-s="cats">Categories & budgets</button><button class="btn" data-s="rules">Remembered merchants (${Object.keys(S.rules).length})</button><button class="btn" data-s="accs">Accounts (${S.accounts.length})</button></div>
    <h3 style="margin-top:18px">Your data</h3>
    <p class="small muted" style="margin-top:4px">Everything lives only on this phone. Back up regularly, and use a backup file to share with your partner: they choose “Merge a backup” and both phones end up with everything.</p>
    <div class="row wrap"><button class="btn gold" data-s="export">Back up or share</button><label class="btn">Merge a backup<input type="file" id="bk" accept=".json,application/json" hidden></label><button class="btn" data-s="snaps">Undo history</button></div>
    <button class="btn danger" style="margin-top:14px" data-s="wipe">Erase everything on this phone</button>
    <p class="tiny faint" style="margin-top:16px">Orbit ${APP_VERSION}. ${S.txns.length} transactions stored. Last backup: ${S.settings.lastBackup ? new Date(S.settings.lastBackup).toLocaleDateString('en-ZA') : 'never'}.</p>`, (el, api) => {
    $$('[data-pp]', el).forEach(i => i.addEventListener('change', () => { const [ix, k] = i.dataset.pp.split(':'); S.people[ix][k] = k === 'age' ? (+i.value || '') : (i.value.trim() || S.people[ix][k]); save(); render(); }));
    $$('[data-st]', el).forEach(i => i.addEventListener('change', () => { S.settings[i.dataset.st] = +i.value || S.settings[i.dataset.st]; save(); render(); }));
    $('#theme', el).addEventListener('click', e => { const b = e.target.closest('[data-th]'); if (!b) return; S.settings.theme = b.dataset.th; $$('#theme button', el).forEach(x => x.setAttribute('aria-pressed', x === b)); applyTheme(); save(); });
    $('#stars', el).addEventListener('change', e => { S.settings.stars = e.target.checked; applyTheme(); save(); });
    $('#bk', el).addEventListener('change', e => { const f = e.target.files[0]; if (f) { api.close(); importBackup(f); } });
    el.addEventListener('click', async e => {
      const b = e.target.closest('[data-s]'); if (!b) return;
      const s = b.dataset.s;
      if (s === 'export') exportBackup();
      if (s === 'cats') { api.close(); manageCats(); }
      if (s === 'rules') { api.close(); manageRules(); }
      if (s === 'accs') { api.close(); manageAccounts(); }
      if (s === 'snaps') { api.close(); manageSnaps(); }
      if (s === 'wipe' && await confirmSheet('Erase everything?', 'All transactions, goals and settings on this phone are deleted. Back up first if you might want them.', 'Erase', true)) { await snapshot('Before erasing'); S = freshState(); S.settings.onboarded = true; save(); api.close(); UI.imp = null; render(); toast('Erased'); }
    });
  });
}
async function exportBackup() {
  if (window.self !== window.top) { toast('Backups work in the installed app, not this preview'); return; }
  const data = JSON.stringify({ app: 'orbit', v: APP_VERSION, exportedAt: new Date().toISOString(), state: S });
  const name = 'orbit-backup-' + ymd(new Date()) + '.json';
  const file = new File([data], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Orbit backup' }); S.settings.lastBackup = Date.now(); save(); render(); toast('Backup saved'); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.append(a); a.click(); a.remove();
    S.settings.lastBackup = Date.now(); save(); render(); toast('Backup downloaded');
  } catch (e) { toast('Backups need the installed app'); }
}
async function importBackup(f) {
  let data; try { data = JSON.parse(await f.text()); } catch (e) { toast('That isn’t an Orbit backup'); return; }
  if (!data || data.app !== 'orbit' || !data.state) { toast('That isn’t an Orbit backup'); return; }
  const inc = migrate(data.state);
  const merge = await confirmSheet('Merge this backup?', `It has ${inc.txns.length} transactions and ${inc.goals.length} goals. Anything already on this phone stays; only new items are added.`, 'Merge');
  if (!merge) return;
  await snapshot('Before merging a backup');
  const pmap = {};
  inc.people.forEach((p, i) => { const match = S.people.find(x => x.name.trim().toLowerCase() === p.name.trim().toLowerCase()); pmap[p.id] = match ? match.id : (S.people[i]?.id || p.id); });
  pmap.joint = 'joint';
  for (const a of inc.accounts) if (!S.accounts.some(x => x.id === a.id)) S.accounts.push({ ...a, owner: pmap[a.owner] || a.owner });
  for (const c of inc.categories) if (!S.categories.some(x => x.id === c.id)) S.categories.push(c);
  for (const k in inc.rules) if (!S.rules[k]) S.rules[k] = inc.rules[k];
  const ids = new Set(S.txns.map(t => t.id)); let added = 0;
  for (const t of inc.txns) if (!ids.has(t.id)) { S.txns.push(t); added++; }
  for (const g of inc.goals) { const mine = S.goals.find(x => x.id === g.id); const ng = { ...g, owner: pmap[g.owner] || g.owner }; if (!mine) S.goals.push(ng); else if ((g.updated || 0) > (mine.updated || 0)) Object.assign(mine, ng); }
  for (const y in inc.tax.slips) for (const p in inc.tax.slips[y]) { const pid = pmap[p] || p; S.tax.slips[y] = S.tax.slips[y] || {}; if (!S.tax.slips[y][pid] || !S.tax.slips[y][pid].gross) S.tax.slips[y][pid] = inc.tax.slips[y][p]; }
  S.txns.sort((a, b) => a.date.localeCompare(b.date));
  save(); render(); toast(`Merged: ${added} new transactions`);
}
function manageCats() {
  const draw = () => `<h2>Categories & budgets</h2><p class="muted small">Tap a colour to change it. Budgets are per month.</p>
    ${S.categories.map(c => `<div class="row" style="padding:8px 0;border-top:1px solid var(--line)" data-cid="${c.id}">
      <input type="color" value="${c.color}" data-k="color" style="width:34px;height:34px;border:0;background:none;padding:0" aria-label="Colour">
      <input class="input" style="width:52px;text-align:center;padding:0" data-k="icon" value="${esc(c.icon)}" maxlength="4" aria-label="Icon">
      <input class="input grow" data-k="name" value="${esc(c.name)}" aria-label="Name">
      ${c.type === 'expense' ? `<div class="money-in" style="width:110px"><input class="input" inputmode="decimal" data-k="budget" value="${+c.budget || ''}" placeholder="Budget" aria-label="Budget"></div>` : `<span class="pill" style="width:110px;text-align:center">${{ income: 'Money in', savings: 'Saving', transfer: 'Ignored' }[c.type]}</span>`}
      ${['other', 'transfer'].includes(c.id) ? '' : `<button class="btn ghost" style="padding:0 6px" data-del="${c.id}" aria-label="Delete">✕</button>`}</div>`).join('')}
    <div class="row" style="margin-top:14px"><button class="btn" data-add="expense">Add spending category</button><button class="btn" data-add="savings">Add saving category</button></div>`;
  openSheet(draw(), (el) => {
    const re = () => { el.innerHTML = '<div class="grab"></div>' + draw(); };
    el.addEventListener('change', e => { const row = e.target.closest('[data-cid]'); if (!row) return; const c = S.categories.find(x => x.id === row.dataset.cid); const k = e.target.dataset.k; c[k] = k === 'budget' ? Math.max(0, num(e.target.value) || 0) : e.target.value; save(); render(); });
    el.addEventListener('click', async e => {
      const d = e.target.closest('[data-del]'), a = e.target.closest('[data-add]');
      if (d) { const c = cat(d.dataset.del); const n = S.txns.filter(t => t.cat === c.id).length; if (await confirmSheet(`Delete ${c.name}?`, n ? `${n} transactions move to Other.` : 'It isn’t used yet.', 'Delete', true)) { S.txns.forEach(t => { if (t.cat === c.id) t.cat = 'other'; }); for (const k in S.rules) if (S.rules[k] === c.id) delete S.rules[k]; S.categories = S.categories.filter(x => x.id !== c.id); S.deletedCats = [...(S.deletedCats || []), c.id]; save(); re(); render(); } }
      if (a) { S.categories.push({ id: 'c' + uid(), name: 'New category', icon: '⭐', type: a.dataset.add, color: PALETTE[S.categories.length % PALETTE.length], budget: 0 }); save(); re(); el.scrollTop = el.scrollHeight; }
    });
  });
}
function manageRules() {
  const draw = () => { const ks = Object.keys(S.rules).sort(); return `<h2>Remembered merchants</h2><p class="muted small">Orbit sorts these automatically. Remove one to be asked again next time.</p>
    ${ks.length ? `<ul class="list-plain">${ks.map(k => `<li><span class="grow ellipsis">${esc(titleCase(k))}</span><span class="chip" style="--c:${cat(S.rules[k]).color}"><span class="dot"></span>${esc(cat(S.rules[k]).name)}</span><button class="btn ghost" style="padding:0 6px" data-k="${esc(k)}" aria-label="Forget">✕</button></li>`).join('')}</ul>` : '<p class="muted">Nothing yet. When you change a category during an import, Orbit remembers it here.</p>'}`; };
  openSheet(draw(), el => el.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (!b) return; delete S.rules[b.dataset.k]; save(); el.innerHTML = '<div class="grab"></div>' + draw(); }));
}
function manageAccounts() {
  const draw = () => `<h2>Accounts</h2>${S.accounts.length ? S.accounts.map(a => `<div style="padding:10px 0;border-top:1px solid var(--line)" data-aid="${a.id}"><div class="row"><input class="input grow" data-k="name" value="${esc(a.name)}"><select class="input" style="width:120px" data-k="owner">${S.people.map(p => `<option value="${p.id}" ${a.owner === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}<option value="joint" ${a.owner === 'joint' ? 'selected' : ''}>Joint</option></select></div>
    <div class="row between" style="margin-top:6px"><span class="tiny muted">${S.txns.filter(t => t.acc === a.id).length} transactions, ${a.type === 'card' ? 'credit card' : 'bank account'}</span><button class="btn danger" style="height:30px" data-del="${a.id}">Delete with its transactions</button></div></div>`).join('') : '<p class="muted">Accounts are created when you import a statement.</p>'}`;
  openSheet(draw(), el => {
    el.addEventListener('change', e => { const r = e.target.closest('[data-aid]'); if (!r) return; acct(r.dataset.aid)[e.target.dataset.k] = e.target.value; save(); render(); });
    el.addEventListener('click', async e => { const b = e.target.closest('[data-del]'); if (!b) return; const a = acct(b.dataset.del); if (await confirmSheet(`Delete ${a.name}?`, 'The account and all its transactions are removed from this phone.', 'Delete', true)) { await snapshot('Before deleting ' + a.name); S.txns = S.txns.filter(t => t.acc !== a.id); S.accounts = S.accounts.filter(x => x.id !== a.id); save(); el.innerHTML = '<div class="grab"></div>' + draw(); render(); } });
  });
}
async function manageSnaps() {
  const snaps = (await Store.get('snapshots')) || [];
  openSheet(`<h2>Undo history</h2><p class="muted small">Orbit saves a copy before every import, merge or delete. Restoring replaces what’s on this phone with that copy.</p>
    ${snaps.length ? `<ul class="list-plain">${snaps.map((s, i) => `<li><span><b>${esc(s.label)}</b><br><span class="tiny muted">${new Date(s.at).toLocaleString('en-ZA')}, ${s.state.txns.length} transactions</span></span><button class="btn" style="height:34px" data-i="${i}">Restore</button></li>`).join('')}</ul>` : '<p class="muted">No copies yet.</p>'}`, (el, api) => {
    el.addEventListener('click', async e => { const b = e.target.closest('[data-i]'); if (!b) return; if (await confirmSheet('Restore this copy?', 'Your current data is saved to the undo history first.', 'Restore')) { const s = snaps[+b.dataset.i]; await snapshot('Before restoring'); S = migrate(s.state); save(); api.close(); render(); toast('Restored'); } });
  });
}
function onboarding() {
  openSheet(`<div style="text-align:center">${BRAND.replace('class="brand-mark"', 'style="width:56px;height:56px"')}</div>
    <h2 style="text-align:center;margin-top:6px">Welcome to Orbit</h2>
    <p class="muted" style="text-align:center">A budget for the two of you that lives only on this phone. First, who’s budgeting?</p>
    <div class="grid2"><label class="field"><span>Your name</span><input class="input" id="n1" value="${S.people[0].name === 'Me' ? '' : esc(S.people[0].name)}" placeholder="Me"></label><label class="field"><span>Your age</span><input class="input" id="a1" inputmode="numeric" value="${S.people[0].age || ''}"></label>
    <label class="field"><span>Your partner</span><input class="input" id="n2" value="${S.people[1].name === 'Wife' ? '' : esc(S.people[1].name)}" placeholder="Wife"></label><label class="field"><span>Their age</span><input class="input" id="a2" inputmode="numeric" value="${S.people[1].age || ''}"></label></div>
    <button class="btn primary block" style="margin-top:18px" id="go">Start</button>
    <p class="tiny faint" style="text-align:center;margin-top:12px">On iPhone, tap Share then “Add to Home Screen” so Orbit opens like an app and keeps your data safe.</p>`, (el, api) => {
    const done = () => { S.people[0].name = $('#n1', el).value.trim() || 'Me'; S.people[1].name = $('#n2', el).value.trim() || 'Wife'; S.people[0].age = +$('#a1', el).value || S.people[0].age; S.people[1].age = +$('#a2', el).value || ''; S.settings.onboarded = true; save(); api.close(); render(); };
    $('#go', el).addEventListener('click', done);
    api.onDismiss = () => { S.settings.onboarded = true; save(); };
  });
}

/* ================= events & start ================= */
document.addEventListener('click', e => {
  if (!e.target.closest('#app')) return;
  const tab = e.target.closest('[data-tab]');
  if (tab) { UI.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const who = e.target.closest('[data-who]'); if (who) { UI.who = who.dataset.who; render(); return; }
  const cr = e.target.closest('[data-cat]'); if (cr) { openCategory(cr.dataset.cat); return; }
  const tx = e.target.closest('[data-tx]'); if (tx) { editTx(tx.dataset.tx); return; }
  const gl = e.target.closest('[data-goal]'); if (gl) { editGoal(S.goals.find(g => g.id === gl.dataset.goal)); return; }
  const tp = e.target.closest('[data-tpl]'); if (tp) { newGoalFromTemplate(+tp.dataset.tpl); return; }
  const rf = e.target.closest('[data-rf]'); if (rf) { UI.imp.filter = rf.dataset.rf; renderReview($('#view')); return; }
  const tpp = e.target.closest('[data-tp]'); if (tpp) { UI.taxPerson = tpp.dataset.tp; render(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const ms = monthsWithData(), cur = ymd(new Date()).slice(0, 7);
  switch (b.dataset.act) {
    case 'settings': openSettings(); break;
    case 'mprev': if (UI.month > (ms[0] || UI.month)) { UI.month = addMonths(UI.month, -1); render(); } break;
    case 'mnext': if (UI.month < (ms[ms.length - 1] > cur ? ms[ms.length - 1] : cur)) { UI.month = addMonths(UI.month, 1); render(); } break;
    case 'allmonths': UI.allMonths = !UI.allMonths; render(); break;
    case 'filtercat': pickCategory(UI.filterCat, { title: 'Show one category' }).then(r => { if (r) { UI.filterCat = r.cat; render(); } }); break;
    case 'clearcat': UI.filterCat = ''; render(); break;
    case 'showother': UI.tab = 'spending'; UI.filterCat = 'other'; UI.allMonths = false; render(); break;
    case 'addtx': addTx(); break;
    case 'backup': exportBackup(); break;
    case 'newgoal': openSheet(`<h2>Add a goal</h2><div class="tpl">${GOAL_TEMPLATES.map((t, i) => `<button data-t="${i}"><span style="font-size:24px">${t.emoji}</span><b>${esc(t.name)}</b><span>${esc(t.note)}</span></button>`).join('')}</div>`, (el, api) => el.addEventListener('click', ev => { const t = ev.target.closest('[data-t]'); if (t) { api.close(); setTimeout(() => newGoalFromTemplate(+t.dataset.t), 200); } })); break;
    case 'ritoggle': { const id = b.closest('[data-ri]').dataset.ri; const it = UI.imp.items.find(x => x.id === id); it.include = !it.include; if (it.include) it.sure = true; const row = b.closest('[data-ri]'); row.outerHTML = reviewRow(it); const n = UI.imp.items.filter(i => i.include && !i.dup).length; const bar = $('.stickybar'); bar.querySelector('.small').textContent = n + ' to add'; const sv = bar.querySelector('[data-act=impsave]'); sv.textContent = 'Save ' + n; sv.disabled = !n; break; }
    case 'ricat': reviewCat(b.closest('[data-ri]').dataset.ri); break;
    case 'impsave': saveImport(); break;
    case 'impcancel': confirmSheet('Cancel this import?', 'Nothing from these files is saved.', 'Cancel import', true).then(ok => { if (ok) { UI.imp = null; render(); } }); break;
  }
});
(async () => {
  await Store.open();
  const saved = await Store.get('state');
  S = migrate(saved || freshState());
  applyTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
  render();
  if (!S.settings.onboarded) onboarding();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !/claude\.ai|claudeusercontent/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();

</script>
